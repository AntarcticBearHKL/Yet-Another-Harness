<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; connect-src 'none'; object-src 'none'"
    />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>MINIHARNESS</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div id="app">
      <div id="drag-strip" aria-hidden="true"></div>

      <div id="window-controls">
        <button id="win-min" class="win-btn" aria-label="Minimize">
          <svg viewBox="0 0 10 10" aria-hidden="true">
            <path d="M1 5h8" />
          </svg>
        </button>
        <button id="win-max" class="win-btn" aria-label="Maximize">
          <svg viewBox="0 0 10 10" aria-hidden="true">
            <rect x="1" y="1" width="8" height="8" />
          </svg>
        </button>
        <button id="win-close" class="win-btn close" aria-label="Close">
          <svg viewBox="0 0 10 10" aria-hidden="true">
            <path d="M1 1l8 8M9 1L1 9" />
          </svg>
        </button>
      </div>

      <div id="shell">
        <aside id="sidebar">
          <div class="sidebar-head">
            <span class="sidebar-caption">CHATS</span>
            <button
              id="toggle-sidebar"
              class="icon-btn"
              aria-label="Collapse sidebar"
              aria-expanded="true"
            >
              <svg viewBox="0 0 24 24" aria-hidden="true">
                <path d="M15 6l-6 6 6 6" />
              </svg>
            </button>
          </div>

          <button id="new-session" class="pill primary wide">
            <svg class="icon" viewBox="0 0 24 24" aria-hidden="true">
              <path d="M12 5v14M5 12h14" />
            </svg>
            <span class="label">New chat</span>
          </button>
          <div class="divider"></div>
          <div id="session-list" class="session-list"></div>
          <div class="sidebar-bottom">
            <div class="divider"></div>
            <button id="open-settings" class="pill wide">
              <svg class="icon" viewBox="0 0 24 24" aria-hidden="true">
                <path
                  d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.39a2 2 0 0 0-.73-2.73l-.15-.08a2 2 0 0 1-1-1.74v-.5a2 2 0 0 1 1-1.74l.15-.09a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z"
                />
                <circle cx="12" cy="12" r="3" />
              </svg>
              <span class="label">Settings</span>
            </button>
          </div>
        </aside>

        <main id="main">
          <section id="messages" class="messages" aria-live="polite"></section>

          <footer id="composer">
            <div class="composer-box">
              <textarea id="input" rows="3" spellcheck="false"></textarea>
              <button id="send" class="send-btn" aria-label="Send">
                <svg viewBox="0 0 24 24" aria-hidden="true">
                  <path d="M2 21L23 12L2 3L2 10L17 12L2 14Z" />
                </svg>
              </button>
            </div>
          </footer>
        </main>
      </div>
    </div>

    <div id="settings-overlay" class="overlay hidden">
      <div class="overlay-panel settings-panel">
        <div class="overlay-head">
          <h2>SETTINGS</h2>
          <button id="close-settings" class="pill compact">Close</button>
        </div>
        <div class="divider"></div>

        <label class="setting-row slider-row">
          <span>Transparency</span>
          <span id="transparency-value" class="muted small">25%</span>
          <input id="transparency" type="range" min="0" max="100" step="1" />
        </label>

        <div class="setting-col">
          <div class="setting-row">
            <span>DeepSeek API key</span>
            <span id="api-key-state" class="muted small">not set</span>
          </div>
          <input
            id="api-key"
            type="password"
            class="text-input"
            autocomplete="off"
            spellcheck="false"
          />
        </div>

        <div class="spacer"></div>
        <div class="overlay-actions">
          <button id="reset-settings" class="pill">Reset</button>
          <button id="done-settings" class="pill primary">Done</button>
        </div>
      </div>
    </div>

    <script src="renderer.js" defer></script>
  </body>
</html>
