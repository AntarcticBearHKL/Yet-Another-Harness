<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; connect-src 'none'; object-src 'none'"
    />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>YAH - Yet Another Harness</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div id="app">
      <div id="window-controls">
        <button id="win-min" class="win-btn" aria-label="Minimize">
          <svg viewBox="0 0 10 10" aria-hidden="true">
            <path d="M1 5h8" />
          </svg>
        </button>
        <button id="win-max" class="win-btn" aria-label="Maximize">
          <svg viewBox="0 0 10 10" aria-hidden="true">
            <rect x="1" y="1" width="8" height="8" />
          </svg>
        </button>
        <button id="win-close" class="win-btn close" aria-label="Close">
          <svg viewBox="0 0 10 10" aria-hidden="true">
            <path d="M1 1l8 8M9 1L1 9" />
          </svg>
        </button>
      </div>

      <div id="shell">
        <main id="main">
          <section id="messages" class="messages" aria-live="polite"></section>

          <div class="edge-blur edge-blur-top" aria-hidden="true"></div>
          <div class="edge-blur edge-blur-bottom" aria-hidden="true"></div>

          <div id="composer" class="composer-overlay" role="dialog" aria-modal="true" aria-label="New message" aria-hidden="true" inert>
            <div class="composer-box">
              <textarea id="input" rows="4" spellcheck="false" placeholder="输入新对话…" aria-label="New message"></textarea>
              <div class="composer-hint">Enter 发送 · Shift+Enter 换行 · Esc 关闭</div>
              <button id="send" class="send-btn" aria-label="Send">
                <svg viewBox="0 0 24 24" aria-hidden="true">
                  <path d="M2 21L23 12L2 3L2 10L17 12L2 14Z" />
                </svg>
              </button>
            </div>
          </div>
        </main>
      </div>
    </div>

    <div
      id="switcher"
      class="overlay"
      role="dialog"
      aria-modal="true"
      aria-labelledby="switcher-title"
      aria-hidden="true"
      inert
    >
      <div class="switcher-head">
        <div>
          <div class="switcher-kicker">WORKSPACE</div>
          <h2 id="switcher-title">项目与对话</h2>
        </div>
        <div class="switcher-actions">
          <button id="switcher-settings" class="pill">Settings</button>
        </div>
      </div>
      <div class="switcher-body">
        <aside class="project-pane">
          <div class="pane-head">
            <span class="pane-kicker">PROJECTS</span>
            <button id="project-new" class="pill compact">New project</button>
          </div>
          <div id="project-list" class="project-list"></div>
        </aside>
        <section class="conversation-pane">
          <div class="pane-head">
            <span class="pane-kicker">CONVERSATIONS · <span id="project-title"></span></span>
            <button id="switcher-new" class="pill primary">New chat</button>
          </div>
          <div id="switcher-list" class="switcher-list"></div>
        </section>
      </div>
      <div class="switcher-foot">
        按住 Tab 显示 · 松开收起 · ↑↓ 选择对话 · Enter 切换 · 点击左侧项目
      </div>
    </div>

    <div id="settings-overlay" class="overlay hidden">
      <div class="overlay-panel settings-panel">
        <div class="overlay-head">
          <h2>SETTINGS</h2>
          <button id="close-settings" class="pill compact">Close</button>
        </div>
        <div class="divider"></div>

        <div class="setting-col">
          <div class="setting-row">
            <span>OpenCode Go API key</span>
            <span id="api-key-state" class="muted small">not set</span>
          </div>
          <input
            id="api-key"
            type="password"
            class="text-input"
            autocomplete="off"
            spellcheck="false"
          />
        </div>

        <div class="spacer"></div>
        <div class="overlay-actions">
          <button id="reset-settings" class="pill">Reset</button>
          <button id="done-settings" class="pill primary">Done</button>
        </div>
      </div>
    </div>

    <div id="raw-overlay" class="overlay hidden">
      <div class="overlay-panel raw-panel">
        <div class="overlay-head">
          <h2>RAW REQUEST BODY</h2>
          <span id="raw-meta" class="muted small"></span>
          <button id="close-raw" class="pill compact">Close</button>
        </div>
        <div class="divider"></div>
        <div id="raw-body" class="raw-body"></div>
      </div>
    </div>

    <script src="renderer.js" defer></script>
  </body>
</html>
