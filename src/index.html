<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; connect-src 'self'; object-src 'none'"
    />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>YAH - Yet Another Harness</title>
    <link rel="stylesheet" href="styles.css" />
    <link rel="stylesheet" href="resize.css" />
  </head>
  <body>
    <div id="app">
      <div id="shell">
        <main id="main">
          <section id="messages" class="messages" aria-live="polite"></section>

          <button
            id="background-badge"
            class="background-badge hidden"
            type="button"
            aria-label="Background tasks"
            aria-haspopup="dialog"
            aria-expanded="false"
          >
            <span class="background-badge-dot" aria-hidden="true"></span>
            <span id="background-badge-count" class="background-badge-count">0</span>
            <span class="background-badge-label">后台</span>
          </button>

          <div class="edge-blur edge-blur-top" aria-hidden="true"></div>
          <div class="edge-blur edge-blur-bottom" aria-hidden="true"></div>

          <div id="composer" class="composer-overlay" role="dialog" aria-modal="true" aria-label="New message" aria-hidden="true" inert>
            <div class="composer-stack">
              <div id="composer-context" class="composer-context"></div>
              <div id="composer-box" class="composer-box">
                <div id="composer-tokens" class="composer-tokens hidden"></div>
                <textarea id="input" rows="4" spellcheck="false" aria-label="New message"></textarea>
                <div id="skill-popup" class="skill-popup hidden" role="listbox" aria-label="Skills"></div>
                <div class="composer-foot">
                  <div id="agent-picker" class="agent-picker">
                    <button
                      id="agent-picker-button"
                      class="agent-picker-button"
                      type="button"
                      aria-haspopup="listbox"
                      aria-expanded="false"
                      aria-controls="agent-menu"
                      aria-label="Select agent"
                    >
                      <span id="agent-picker-value" class="agent-picker-value">Build</span>
                    </button>
                  </div>
                  <div id="model-picker" class="model-picker">
                    <button
                      id="model-picker-button"
                      class="model-picker-button"
                      type="button"
                      aria-haspopup="listbox"
                      aria-expanded="false"
                      aria-controls="model-menu"
                    >
                      <span id="model-picker-value" class="model-picker-value">deepseek-v4.1-flash-1017</span>
                      <svg class="model-picker-chevron" viewBox="0 0 24 24" aria-hidden="true">
                        <path d="M6 9l6 6 6-6" />
                      </svg>
                    </button>
                    <div id="model-menu" class="model-menu hidden" role="listbox" aria-label="Model">
                      <button class="model-menu-item selected" type="button" role="option" aria-selected="true">
                        <span>deepseek-v4.1-flash-1017</span>
                        <span class="model-menu-check" aria-hidden="true">✓</span>
                      </button>
                    </div>
                  </div>
                  <div id="composer-effort" class="composer-effort">
                    <div
                      id="composer-effort-rail"
                      class="effort-rail"
                      role="slider"
                      tabindex="0"
                      aria-label="Reasoning effort"
                      aria-valuemin="0"
                      aria-valuemax="2"
                      aria-valuenow="1"
                      aria-valuetext="high"
                    >
                      <div class="effort-rail-fill" aria-hidden="true"></div>
                      <div class="effort-rail-knob" aria-hidden="true"></div>
                    </div>
                  </div>
                  <button id="send" class="send-btn" aria-label="Send">
                    <svg viewBox="0 0 24 24" aria-hidden="true">
                      <path d="M18 6v6a3 3 0 0 1-3 3H7" />
                      <path d="M10 12l-3 3 3 3" />
                    </svg>
                  </button>
                </div>
              </div>
            </div>
          </div>
        </main>
      </div>
    </div>

    <div id="ring-menu" class="ring-menu" aria-hidden="true">
      <svg
        id="ring-svg"
        class="ring-svg"
        viewBox="0 0 300 300"
        aria-hidden="true"
      ></svg>
    </div>

    <div
      id="agent-menu"
      class="agent-menu hidden"
      role="listbox"
      aria-label="Agent"
    ></div>

    <div
      id="action-menu"
      class="action-menu hidden"
      role="menu"
      aria-label="Actions"
      aria-hidden="true"
    ></div>

    <div
      id="question-dock"
      class="question-dock hidden"
      role="dialog"
      aria-modal="true"
      aria-label="Questions"
      aria-hidden="true"
    >
      <div class="question-dock-head">
        <span id="question-dock-progress" class="question-dock-progress"></span>
        <div
          id="question-dock-timer"
          class="question-dock-timer hidden"
          aria-live="off"
        >
          <svg
            class="question-timer-ring"
            viewBox="0 0 20 20"
            aria-hidden="true"
          >
            <circle
              class="question-timer-track"
              cx="10"
              cy="10"
              r="8"
              pathLength="100"
            ></circle>
            <circle
              id="question-dock-timer-progress"
              class="question-timer-progress"
              cx="10"
              cy="10"
              r="8"
              pathLength="100"
            ></circle>
          </svg>
          <span id="question-dock-timer-value" class="question-timer-value"></span>
        </div>
        <button
          id="question-dock-close"
          class="question-dock-close"
          type="button"
          aria-label="Dismiss question"
        >
          ×
        </button>
      </div>
      <div id="question-dock-body" class="question-dock-body"></div>
      <div class="question-dock-foot">
        <button id="question-dock-back" class="pill compact" type="button">
          Back
        </button>
        <button id="question-dock-next" class="pill primary" type="button">
          Next
        </button>
      </div>
    </div>

    <div
      id="catalog"
      class="catalog hidden"
      role="dialog"
      aria-modal="true"
      aria-label="tool"
      aria-hidden="true"
    >
      <div class="catalog-body">
        <aside class="catalog-side">
          <div id="catalog-categories" class="catalog-categories"></div>
        </aside>
        <section class="catalog-main">
          <div id="catalog-list" class="catalog-list"></div>
        </section>
      </div>
      <div class="edge-blur edge-blur-short edge-blur-top" aria-hidden="true"></div>
      <div class="edge-blur edge-blur-short edge-blur-bottom" aria-hidden="true"></div>
    </div>

    <div
      id="mcp-overlay"
      class="mcp hidden"
      role="dialog"
      aria-modal="true"
      aria-label="MCP"
      aria-hidden="true"
    >
      <div class="mcp-body">
        <aside class="mcp-side">
          <div id="mcp-server-list" class="mcp-server-list"></div>
          <button id="mcp-add" class="mcp-add" type="button">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="M12 5v14M5 12h14" />
            </svg>
            添加服务器
          </button>
        </aside>
        <section class="mcp-main">
          <div id="mcp-empty" class="mcp-empty">
            还没有 MCP 服务器
          </div>
          <div id="mcp-detail" class="mcp-detail hidden">
            <header class="mcp-head">
              <div class="mcp-identity">
                <div class="mcp-title-wrap">
                  <div class="mcp-subline">
                    <span id="mcp-title" class="mcp-name">MCP</span>
                    <span id="mcp-status" class="mcp-status idle">未连接</span>
                    <span id="mcp-transport" class="mcp-transport">STDIO</span>
                  </div>
                </div>
              </div>
              <div class="mcp-actions">
                <button id="mcp-refresh" class="pill compact" type="button">
                  刷新
                </button>
                <button id="mcp-reconnect" class="pill compact" type="button">
                  重连
                </button>
                <button id="mcp-edit" class="pill compact" type="button">
                  编辑
                </button>
                <button
                  id="mcp-delete"
                  class="pill compact danger"
                  type="button"
                >
                  删除
                </button>
              </div>
            </header>
            <div id="mcp-error" class="mcp-error hidden"></div>
            <nav id="mcp-tabs" class="mcp-tabs">
              <button type="button" data-tab="overview">
                概览<span class="mcp-tab-count"></span>
              </button>
              <button type="button" data-tab="tools">
                工具<span class="mcp-tab-count"></span>
              </button>
              <button type="button" data-tab="resources">
                资源<span class="mcp-tab-count"></span>
              </button>
              <button type="button" data-tab="prompts">
                提示词<span class="mcp-tab-count"></span>
              </button>
              <button type="button" data-tab="logs">
                日志<span class="mcp-tab-count"></span>
              </button>
            </nav>
            <div id="mcp-tab-body" class="mcp-tab-body"></div>
          </div>
        </section>
      </div>
      <div class="edge-blur edge-blur-short edge-blur-top" aria-hidden="true"></div>
      <div
        class="edge-blur edge-blur-short edge-blur-bottom"
        aria-hidden="true"
      ></div>
      <div id="mcp-toast" class="mcp-toast hidden" aria-live="polite"></div>
    </div>

    <div id="mcp-form-overlay" class="overlay hidden" aria-hidden="true">
      <div class="overlay-panel mcp-form-panel">
        <div class="mcp-form-scroll">
          <div class="segmented mcp-form-mode">
            <button
              id="mcp-form-mode-form"
              class="pill compact"
              type="button"
              aria-pressed="true"
            >
              表单
            </button>
            <button
              id="mcp-form-mode-json"
              class="pill compact"
              type="button"
              aria-pressed="false"
            >
              JSON 配置
            </button>
          </div>
          <div id="mcp-form-fields" class="mcp-form-fields">
            <div class="mcp-field">
              <span class="mcp-label">名称</span>
              <input
                id="mcp-form-name"
                class="mcp-input"
                type="text"
                spellcheck="false"
                placeholder="my-mcp-server"
              />
            </div>
            <div class="mcp-field full">
              <span class="mcp-label">传输方式</span>
              <div id="mcp-form-transport" class="segmented">
                <button
                  class="pill compact"
                  type="button"
                  data-transport="stdio"
                  aria-pressed="true"
                >
                  STDIO
                </button>
                <button
                  class="pill compact"
                  type="button"
                  data-transport="http"
                  aria-pressed="false"
                >
                  Streamable HTTP
                </button>
                <button
                  class="pill compact"
                  type="button"
                  data-transport="sse"
                  aria-pressed="false"
                >
                  SSE
                </button>
              </div>
            </div>
            <div id="mcp-form-stdio" class="mcp-form-group">
              <div class="mcp-field full">
                <span class="mcp-label">命令</span>
                <input
                  id="mcp-form-command"
                  class="mcp-input"
                  type="text"
                  spellcheck="false"
                  placeholder="npx"
                />
                <span class="mcp-field-desc">
                  例如 npx、node
                </span>
              </div>
              <div class="mcp-field full">
                <span class="mcp-label">参数（每行一个）</span>
                <textarea
                  id="mcp-form-args"
                  class="mcp-textarea"
                  rows="4"
                  spellcheck="false"
                  placeholder="-y&#10;@modelcontextprotocol/server-filesystem&#10;D:\Dev"
                ></textarea>
              </div>
              <div class="mcp-field">
                <span class="mcp-label">工作目录（可选）</span>
                <input
                  id="mcp-form-cwd"
                  class="mcp-input"
                  type="text"
                  spellcheck="false"
                  placeholder="D:\Dev\my-server"
                />
              </div>
              <div class="mcp-field">
                <span class="mcp-label">环境变量 KEY=VALUE（每行一个）</span>
                <textarea
                  id="mcp-form-env"
                  class="mcp-textarea"
                  rows="4"
                  spellcheck="false"
                  placeholder="API_KEY=..."
                ></textarea>
              </div>
            </div>
            <div id="mcp-form-remote" class="mcp-form-group hidden">
              <div class="mcp-field full">
                <span class="mcp-label">URL</span>
                <input
                  id="mcp-form-url"
                  class="mcp-input"
                  type="url"
                  spellcheck="false"
                  placeholder="https://example.com/mcp"
                />
              </div>
              <div class="mcp-field full">
                <span class="mcp-label">Headers KEY=VALUE（每行一个）</span>
                <textarea
                  id="mcp-form-headers"
                  class="mcp-textarea"
                  rows="4"
                  spellcheck="false"
                  placeholder="Authorization=Bearer ..."
                ></textarea>
              </div>
            </div>
          </div>
          <div id="mcp-form-json-wrap" class="mcp-form-json-wrap hidden">
            <textarea
              id="mcp-form-json"
              class="mcp-textarea mcp-json-input"
              rows="14"
              spellcheck="false"
              placeholder='{"mcpServers":{"filesystem":{"command":"npx","args":["-y","@modelcontextprotocol/server-filesystem","D:\\Dev"]}}}'
            ></textarea>
            <div class="mcp-field-desc">
              支持 mcpServers / mcp.servers / servers
            </div>
          </div>
          <div id="mcp-form-error" class="mcp-inline-error hidden"></div>
        </div>
        <div class="overlay-actions">
          <button id="mcp-form-cancel" class="pill" type="button">
            Cancel
          </button>
          <button id="mcp-form-save" class="pill primary" type="button">
            Save
          </button>
        </div>
        <div
          class="edge-blur edge-blur-short edge-blur-top"
          aria-hidden="true"
        ></div>
        <div
          class="edge-blur edge-blur-short edge-blur-bottom"
          aria-hidden="true"
        ></div>
      </div>
    </div>

    <div id="mcp-config" class="mcp-config hidden" role="dialog" aria-modal="true" aria-label="MCP" aria-hidden="true">
      <div class="mcp-config-panel">
        <div class="mcp-config-head">
          <span id="mcp-config-summary" class="mcp-config-summary"></span>
        </div>
        <div id="mcp-config-grid" class="mcp-config-grid"></div>
      </div>
    </div>

    <div id="web-content" class="web-content hidden" aria-hidden="true">
      <div id="web-content-body" class="web-content-body"></div>
      <div class="edge-blur edge-blur-top" aria-hidden="true"></div>
      <div class="edge-blur edge-blur-bottom" aria-hidden="true"></div>
    </div>

    <button
      id="mobile-compose"
      class="mobile-compose"
      type="button"
      aria-label="New message"
    >
      <svg viewBox="0 0 24 24" aria-hidden="true">
        <path d="M12 5v14M5 12h14" />
      </svg>
    </button>

    <div
      id="switcher"
      class="overlay"
      role="dialog"
      aria-modal="true"
      aria-label="Workspace"
      aria-hidden="true"
      inert
    >
      <div class="switcher-body">
        <aside class="project-pane">
          <div id="project-list" class="project-list"></div>
        </aside>
        <section class="conversation-pane">
          <div id="switcher-list" class="switcher-list"></div>
        </section>
      </div>
      <div class="edge-blur edge-blur-short edge-blur-top" aria-hidden="true"></div>
      <div class="edge-blur edge-blur-short edge-blur-bottom" aria-hidden="true"></div>
    </div>

    <div id="rename-overlay" class="overlay hidden" aria-hidden="true">
      <div class="overlay-panel rename-panel">
        <input
          id="rename-input"
          class="text-input"
          type="text"
          spellcheck="false"
          autocomplete="off"
        />
        <div class="overlay-actions">
          <button id="rename-cancel" class="pill" type="button">Cancel</button>
          <button id="rename-save" class="pill primary" type="button">
            Save
          </button>
        </div>
        <div
          class="edge-blur edge-blur-short edge-blur-top"
          aria-hidden="true"
        ></div>
        <div
          class="edge-blur edge-blur-short edge-blur-bottom"
          aria-hidden="true"
        ></div>
      </div>
    </div>

    <div id="confirm-overlay" class="overlay hidden" aria-hidden="true">
      <div class="overlay-panel confirm-panel">
        <p id="confirm-text" class="confirm-text"></p>
        <div class="overlay-actions">
          <button id="confirm-cancel" class="pill" type="button">
            Cancel
          </button>
          <button id="confirm-ok" class="pill danger-solid" type="button">
            Delete
          </button>
        </div>
        <div
          class="edge-blur edge-blur-short edge-blur-top"
          aria-hidden="true"
        ></div>
        <div
          class="edge-blur edge-blur-short edge-blur-bottom"
          aria-hidden="true"
        ></div>
      </div>
    </div>

    <div id="skill-args-overlay" class="overlay hidden" aria-hidden="true">
      <div class="overlay-panel skill-args-panel">
        <p id="skill-args-desc" class="muted small"></p>
        <div id="skill-args-fields" class="skill-args-fields"></div>
        <div id="skill-args-error" class="skill-args-error hidden"></div>
        <div class="overlay-actions">
          <button id="skill-args-cancel" class="pill" type="button">
            Cancel
          </button>
          <button id="skill-args-attach" class="pill primary" type="button">
            Attach
          </button>
        </div>
        <div
          class="edge-blur edge-blur-short edge-blur-top"
          aria-hidden="true"
        ></div>
        <div
          class="edge-blur edge-blur-short edge-blur-bottom"
          aria-hidden="true"
        ></div>
      </div>
    </div>

    <div id="project-overlay" class="overlay hidden" aria-hidden="true">
      <div class="overlay-panel project-panel">
        <label class="project-field">
          <span class="project-field-label">项目名称</span>
          <input
            id="project-name"
            class="text-input"
            type="text"
            spellcheck="false"
            placeholder="Project"
          />
        </label>
        <div
          id="project-drop"
          class="project-drop"
          tabindex="0"
          aria-label="添加开发目录"
        >
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M3 7a2 2 0 0 1 2-2h5l2 2h7a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V7Z" />
            <path d="M12 11v5M9.5 13.5 12 11l2.5 2.5" />
          </svg>
        </div>
        <div id="project-dirs" class="project-dirs"></div>
        <div id="project-error" class="project-error hidden"></div>
        <div class="overlay-actions">
          <button id="project-cancel" class="pill" type="button">
            Cancel
          </button>
          <button id="project-save" class="pill primary" type="button">
            Create
          </button>
        </div>
      </div>
    </div>

    <div
      id="approval-overlay"
      class="approval-dock hidden"
      role="dialog"
      aria-modal="true"
      aria-label="File access approval"
      aria-hidden="true"
    >
      <div class="approval-dock-head">
        <div class="approval-dock-copy">
          <span class="approval-kicker">FILE ACCESS</span>
          <span class="approval-text">访问项目目录之外的路径</span>
        </div>
        <span id="approval-tool" class="approval-tool-badge">file</span>
      </div>
      <div class="approval-dock-body">
        <div id="approval-path" class="approval-path"></div>
        <div class="approval-dirs">
          <div class="approval-dirs-label">当前项目目录</div>
          <div id="approval-dirs"></div>
        </div>
      </div>
      <div class="approval-dock-foot">
        <button id="approval-deny" class="pill compact" type="button">
          拒绝
        </button>
        <button id="approval-allow" class="pill primary" type="button">
          允许一次
        </button>
      </div>
    </div>

    <div id="background-overlay" class="overlay hidden" aria-hidden="true">
      <div class="overlay-panel background-panel">
        <div class="background-head">
          <span id="background-summary" class="background-summary"></span>
          <button
            id="background-close"
            class="background-close"
            type="button"
            aria-label="Close background tasks"
          >
            ×
          </button>
        </div>
        <div id="background-list" class="background-list"></div>
      </div>
    </div>

    <div id="goal-overlay" class="overlay hidden" aria-hidden="true">
      <div class="overlay-panel goal-panel">
        <label class="goal-field">
          <span class="goal-field-label">目标</span>
          <textarea
            id="goal-objective"
            class="text-input goal-objective-input"
            rows="5"
            spellcheck="false"
            placeholder="描述最终状态和验证方式…"
          ></textarea>
        </label>
        <label class="goal-field">
          <span class="goal-field-label">Token 预算（可选）</span>
          <input
            id="goal-budget"
            class="text-input"
            type="number"
            min="1000"
            step="1000"
            placeholder="留空不限"
          />
        </label>
        <p class="goal-hint">
          目标保存在当前对话，每轮自动检查
        </p>
        <div id="goal-error" class="goal-error hidden"></div>
        <div class="overlay-actions">
          <button id="goal-cancel" class="pill" type="button">Cancel</button>
          <button id="goal-start" class="pill primary" type="button">
            Start Goal
          </button>
        </div>
      </div>
    </div>

    <div id="settings-overlay" class="overlay hidden">
      <div class="overlay-panel settings-panel">
        <div class="setting-col">
          <div class="setting-row">
            <span>OpenCode Go API key</span>
            <span id="api-key-state" class="muted small">not set</span>
          </div>
          <input
            id="api-key"
            type="password"
            class="text-input"
            autocomplete="off"
            spellcheck="false"
          />
        </div>

        <div class="divider"></div>

        <div class="setting-col pairing-col">
          <div class="setting-row">
            <span>手机连接</span>
            <span id="pairing-state" class="muted small">加载中…</span>
          </div>
          <div class="pairing-card">
            <img id="pairing-qr" class="pairing-qr" alt="手机连接二维码" />
            <div class="pairing-info">
              <div id="pairing-address" class="pairing-address">—</div>
              <div id="pairing-password" class="pairing-password">—</div>
              <div class="pairing-hint">同一 Wi-Fi 下扫码连接</div>
            </div>
          </div>
        </div>

        <div class="spacer"></div>
        <div class="overlay-actions">
          <button id="reset-settings" class="pill">Reset</button>
          <button id="done-settings" class="pill primary">Done</button>
        </div>
        <div class="edge-blur edge-blur-short edge-blur-top" aria-hidden="true"></div>
        <div class="edge-blur edge-blur-short edge-blur-bottom" aria-hidden="true"></div>
      </div>
    </div>

    <div id="raw-overlay" class="overlay hidden">
      <div class="overlay-panel raw-panel">
        <span id="raw-meta" class="muted small raw-meta"></span>
