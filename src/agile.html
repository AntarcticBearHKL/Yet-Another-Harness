<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; connect-src 'self'; object-src 'none'"
    />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>YAH - Agile</title>
    <link rel="stylesheet" href="styles.css" />
    <link rel="stylesheet" href="agile.css" />
    <link rel="stylesheet" href="resize.css" />
  </head>
  <body class="agile-window">
    <div
      id="agile"
      class="agile hidden"
      role="dialog"
      aria-modal="true"
      aria-label="Agile"
      aria-hidden="true"
    >
      <div class="agile-shell">
        <aside class="agile-sidebar">
          <div id="agile-iterations" class="agile-iterations"></div>
        </aside>
        <section class="agile-main">
          <div id="agile-board" class="agile-board"></div>
          <div id="agile-toast" class="agile-toast hidden"></div>
        </section>
      </div>
    </div>

    <div id="agile-task-modal" class="overlay hidden" aria-hidden="true">
      <div class="overlay-panel agile-task-panel">
        <header class="agile-modal-head">
          <div class="agile-modal-title-wrap">
            <span id="agile-task-kicker" class="agile-kicker">TASK</span>
            <h3 id="agile-task-modal-title">任务</h3>
          </div>
        </header>
        <div class="agile-task-scroll">
          <label class="agile-field">
            <span>标题</span>
            <input id="agile-task-title" class="text-input" type="text" />
          </label>
          <label class="agile-field">
            <span>描述</span>
            <textarea
              id="agile-task-description"
              class="text-input agile-textarea"
              rows="4"
            ></textarea>
          </label>
          <div id="agile-task-readonly-note" class="agile-readonly-note hidden"></div>
          <section class="agile-notes">
            <div class="agile-notes-head">
              <span>给 Agent 的备注</span>
              <span id="agile-notes-state"></span>
            </div>
            <div id="agile-task-notes" class="agile-note-list"></div>
            <div id="agile-note-add" class="agile-note-add">
              <input
                id="agile-note-input"
                class="text-input"
                type="text"
                maxlength="300"
                placeholder="写一条备注，Enter 添加…"
              />
              <button id="agile-note-submit" class="pill compact" type="button">
                添加
              </button>
            </div>
            <div id="agile-note-lock" class="agile-readonly-note hidden"></div>
          </section>
          <div id="agile-task-info" class="agile-task-info"></div>
        </div>
        <footer class="agile-modal-foot">
          <button id="agile-task-delete" class="pill danger" type="button">
            删除
          </button>
          <div class="agile-foot-spacer"></div>
          <button id="agile-task-cancel" class="pill" type="button">关闭</button>
          <button id="agile-task-save" class="pill primary" type="button">
            保存
          </button>
        </footer>
      </div>
    </div>

    <div id="confirm-overlay" class="overlay hidden" aria-hidden="true">
      <div class="overlay-panel confirm-panel">
        <p id="confirm-text" class="confirm-text"></p>
        <div class="overlay-actions">
          <button id="confirm-cancel" class="pill" type="button">
            Cancel
          </button>
          <button id="confirm-ok" class="pill danger-solid" type="button">
            Delete
          </button>
        </div>
        <div
          class="edge-blur edge-blur-short edge-blur-top"
          aria-hidden="true"
        ></div>
        <div
          class="edge-blur edge-blur-short edge-blur-bottom"
          aria-hidden="true"
        ></div>
      </div>
    </div>

    <script src="resize.js"></script>
    <script src="agile-ui.js"></script>
    <script src="agile-window.js"></script>
  </body>
</html>
