<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; connect-src 'none'; object-src 'none'"
    />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>YAH - Content</title>
    <link rel="stylesheet" href="content.css" />
    <link rel="stylesheet" href="resize.css" />
  </head>
  <body>
    <div id="content-app">
      <header class="titlebar">
        <span id="content-title" class="title">CONTENT</span>
        <button id="content-close" class="close" aria-label="Close">×</button>
      </header>
      <main id="content" class="content"></main>
      <div class="edge-blur edge-blur-short edge-blur-top" aria-hidden="true"></div>
      <div class="edge-blur edge-blur-short edge-blur-bottom" aria-hidden="true"></div>
    </div>
    <script src="resize.js"></script>
    <script src="content.js"></script>
  </body>
</html>
